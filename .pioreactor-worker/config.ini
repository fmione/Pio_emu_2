[PWM]
1=stirring
2=waste
3=media
4=alt_media
5=heating

[leds]
A=IR
B=white_light
C=
D=

[monitor.config]
enable_button=auto
self_check_interval_hours=12

[bioreactor]
efflux_tube_volume_ml=14
initial_volume_ml=14
initial_alt_media_fraction=0.0
initial_cumulative_media_added_ml=0
initial_cumulative_alt_media_added_ml=0
initial_cumulative_waste_removed_ml=0

[stirring.config]
initial_target_rpm=500
initial_duty_cycle=15
pwm_hz=200
use_rpm=True
duration_between_updates_seconds=23
post_delay_duration=0.25
pre_delay_duration=0.25
enable_dodging_od=false
target_rpm_during_od_reading=0
target_rpm_outside_od_reading=500

[dosing_automation.turbidostat]
biomass_signal=auto

[stirring.pid]
Kp=0.007
Ki=0.0
Kd=0.0

[od_config.photodiode_channel]
1=REF
2=90

[od_reading.config]
samples_per_second=0.12
turn_off_leds_during_reading=1
pd_reference_ema=0.4
ir_led_intensity=auto
ref_normalization=unity
smoothing_penalizer=6.0
duration_between_led_off_and_od_reading=0.1
use_dark_offsets=0

[storage]
database=/home/pioreactor/.pioreactor/storage/pioreactor.sqlite
temporary_cache=/home/pioreactor/.pioreactor/storage/local_intermittent_pioreactor_metadata.sqlite
persistent_cache=/home/pioreactor/.pioreactor/storage/local_persistent_pioreactor_metadata.sqlite
number_of_backup_replicates_to_workers=0

[logging]
log_file=/home/pioreactor/.pioreactor/pioreactor.log
ui_log_file=/home/pioreactor/.pioreactor/pioreactor.log
ui_log_level=DEBUG
console_log_level=DEBUG

[cluster.addresses]
pio01=backend
worker01=worker01

[cluster.topology]
leader_hostname=backend
leader_address=backend

[ui]
port=4999
proto=http

[ui.overview.settings]
filtered_od_lookback_minutes=240
raw_od_lookback_minutes=240
log_display_count=65
time_display_mode=hours

[ui.overview.charts]
implied_growth_rate=0
implied_daily_growth_rate=0
fraction_of_volume_that_is_alternative_media=0
normalized_optical_density=0
raw_od_lookback_minutes=240
fused_optical_density=0
optical_density=1
temperature=1

[ui.overview.cards]
dosings=1
event_logs=1
profiles=1

[dosing_automation.pid_morbidostat]
Kp=5
Ki=0
Kd=0

[temperature_automation.thermostat]
Kp=.01
Ki=.01
Kd=.01

[temperature_automation.fir]
mlx_address=0x3A
sample_period_s=1.0
default_estimator_name=fir_temperature_estimator_linear_mlx_ambient_pcb_v1

[mqtt]
username=pioreactor
password=raspberry
broker_address=mosquitto
broker_ws_port=9001
broker_port=1883
ws_protocol=ws
use_tls=0

[dosing_automation.config]
pause_between_subdoses_seconds=0.5
waste_removal_multiplier=2.0
max_volume_to_warn=17.0
max_volume_to_stop=18.0
max_subdose=1.0
experimental_pump_malfunction_tolerance=0.2
experimental_detect_pump_malfunction=False

[growth_rate_calculating.config]
ekf_outlier_std_threshold=3.0
samples_for_od_statistics=35
