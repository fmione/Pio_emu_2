experiment_profile_name: Exp_chemostat
metadata:
  author: ML
  description: Initial dosing profile
common:
  jobs:
    stirring:
      actions:
      - type: start
        hours_elapsed: 0.0
        options:
          target_rpm: 500.0
    temperature_automation:
      actions:
      - type: start
        hours_elapsed: 0.0
        options:
          automation_name: thermostat
          target_temperature: 30

pioreactors:
  pio01:
    jobs:
      od_reading:
        actions:
        - type: start
          hours_elapsed: 0.0
          options:
            ir_led_intensity: 80

  worker01:
    jobs:
      od_reading:
        actions:
        - type: start
          hours_elapsed: 0.0
          options:
            ir_led_intensity: 80