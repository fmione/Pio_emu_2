experiment_profile_name: Exp_emulator
metadata:
  author: fede
  description: >
    Initial dosing profile for accelerated mode (acceleration != 1).
    Times t are in simulation hours relative to the moment the emulator
    reads the file; it is re-anchored only when this file changes.
pioreactors:
  pio01:
    jobs:
      add_media:
        actions:
        - type: start
          t: 0.0
          options:
            ml: 0.5 
  worker01:
    jobs: 
      add_media:
        actions:
        - type: start
          t: 0.0
          options:
            ml: 0.5
        